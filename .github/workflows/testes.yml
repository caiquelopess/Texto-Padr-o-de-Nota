name: Qualidade e testes

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Build, lint, Knip, arquitetura e commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: index.html gerado a partir de src/ (não editar à mão)
        run: npm run build:check
      - run: npm run lint
      - run: npm run knip
      - run: npm run arquitetura
      - name: Mensagens de commit (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  unitarios:
    name: Unitários + cobertura (Codecov) + mutação (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:unit
      - uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - run: npm run mutacao
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: relatorio-mutacao, path: reports/mutation/, retention-days: 7 }

  e2e:
    name: Playwright (computador e celular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: relatorio-playwright, path: playwright-report/, retention-days: 7 }
